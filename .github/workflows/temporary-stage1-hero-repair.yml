name: Temporary Stage 1 hero repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  rebuild-approved-hero:
    if: github.head_ref == 'agent/stage1-stability-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild and validate approved hero
        shell: bash
        run: |
          set -euo pipefail
          output='assets/stage1/masinloc-hero.avif'
          : > "$output"
          for part in \
            assets/stage1/hero-b64-01.txt \
            assets/stage1/hero-b64-02.txt \
            assets/stage1/hero-b64-03.txt \
            assets/stage1/hero-b64-04.txt \
            assets/stage1/hero-b64-05.txt \
            assets/stage1/hero-b64-06.txt \
            assets/stage1/hero-b64-07.txt
          do
            tr -d '\r\n' < "$part" | base64 --decode >> "$output"
          done

          bytes=$(stat -c%s "$output")
          echo "hero bytes: ${bytes}"
          test "$bytes" -gt 60000
          file "$output" | tee /tmp/hero-type.txt
          grep -Eiq 'AVIF|AV1|ISO Media' /tmp/hero-type.txt

      - name: Commit verified binary to repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stage1/masinloc-hero.avif
          if git diff --cached --quiet; then
            echo "Verified hero already present."
            exit 0
          fi
          git commit -m "Rebuild verified Masinloc hero asset"
          git push origin HEAD:${{ github.head_ref }}