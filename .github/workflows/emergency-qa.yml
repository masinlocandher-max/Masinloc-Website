name: Emergency Response QA

on:
  pull_request:
    paths:
      - 'emergency/**'
      - 'supabase/functions/emergency-response/**'
      - 'supabase/migrations/**'
      - 'scripts/check-migrations-apply.py'
      - 'scripts/emergency-*.mjs'
      - 'scripts/check-emergency-consolidation.py'
      - '.github/workflows/emergency-qa.yml'
  push:
    branches:
      - main
      - 'agent/emergency-pnp-mdrrmo-mvp'
    paths:
      - 'emergency/**'
      - 'supabase/functions/emergency-response/**'
      - 'supabase/migrations/**'
      - 'scripts/check-migrations-apply.py'
      - 'scripts/emergency-*.mjs'
      - 'scripts/check-emergency-consolidation.py'
      - '.github/workflows/emergency-qa.yml'

permissions:
  contents: read

jobs:
  emergency-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check emergency/emergency.js
          node --check emergency/sw.js
          node --check emergency/agency.js
      - name: Emergency contract checks
        run: node scripts/emergency-qa.mjs
      - name: Verify one PNP/MDRRMO architecture, not two
        run: python3 scripts/check-emergency-consolidation.py
      # Every other check on the schema reads the SQL as text. This one runs it.
      # A migration is applied to production by a person, once, under pressure;
      # finding out there that a function body does not compile is too late.
      - name: Install PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql
      - name: Migrations apply, re-apply, and activation actually works
        run: python3 scripts/check-migrations-apply.py
