name: Generate sitemap debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate sitemap
        run: python3 scripts/build-sitemap.py
      - name: Upload generated sitemap
        uses: actions/upload-artifact@v7
        with:
          name: generated-sitemap
          path: sitemap.xml
          retention-days: 1
