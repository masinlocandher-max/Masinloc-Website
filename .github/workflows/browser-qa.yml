name: Browser QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/masinloc-server.log 2>&1 &
          echo $! > /tmp/masinloc-server.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/masinloc-server.log
          exit 1

      - name: Run desktop and mobile browser checks
        run: node scripts/browser-qa.mjs

      - name: Run Sambal Tina dictionary checks
        run: node scripts/dictionary-qa.mjs

      - name: Run living Sambal Tina checks
        run: node scripts/living-sambal-qa.mjs

      - name: Run Masinloc Connect privacy and mobile checks
        run: node scripts/connect-qa.mjs

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masinloc-browser-qa
          path: artifacts/browser-qa/*.png
          if-no-files-found: warn
          retention-days: 7
