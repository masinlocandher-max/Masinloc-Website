name: Browser QA

# Site integrity has always run on both. Browser QA ran only on pull requests,
# so every direct push to main — which is what production deploys from — went
# out with none of the browser suites having run against it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/masinloc-server.log 2>&1 &
          echo $! > /tmp/masinloc-server.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/masinloc-server.log
          exit 1

      - name: Run desktop and mobile browser checks
        run: node scripts/browser-qa.mjs

      - name: Run homepage checks
        run: node scripts/homepage-qa.mjs

      - name: Run Sambal Tina dictionary checks
        run: node scripts/dictionary-qa.mjs

      - name: Run editable dictionary layer checks
        run: node scripts/dictionary-entries-qa.mjs

      - name: Run living Sambal Tina checks
        run: node scripts/living-sambal-qa.mjs

      - name: Run Sambal Tina community checks
        run: node scripts/sambal-community-qa-v2.mjs

      - name: Run Masinloc Connect privacy and mobile checks
        run: node scripts/connect-qa.mjs

      - name: Run Masinloc locations checks
        run: node scripts/destinations-qa.mjs

      - name: Run MABAYANI flagship checks
        run: node scripts/mabayani-qa.mjs

      - name: Run municipal leadership checks
        run: node scripts/leadership-qa.mjs

      - name: Run Discover Masinloc checks
        run: node scripts/discover-qa.mjs

      - name: Run Marketplace checks
        run: node scripts/marketplace-qa.mjs

      - name: Run hidden MANAMBALI word-connect checks
        run: node scripts/wordscapes-qa.mjs

      - name: Verify critical sections still hold their shape
        run: node scripts/layout-contracts.mjs

      - name: Measure text contrast against what is painted behind it
        run: node scripts/contrast-qa.mjs

      - name: Run responsive checks across screen sizes
        run: node scripts/responsive-qa.mjs

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masinloc-browser-qa
          path: artifacts/browser-qa/*.png
          if-no-files-found: warn
          retention-days: 7
