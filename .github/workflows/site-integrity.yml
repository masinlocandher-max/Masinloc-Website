name: Site integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # Full history, not the default shallow clone. sitemap.xml derives each
        # page's lastmod from the last commit that touched it, and a shallow
        # checkout reports the tip commit's date for every file — which would
        # make the sitemap check fail on every run, and would silently stamp
        # every page with the deploy date if it ever wrote instead of checked.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Stage 1 integrity
        run: python3 scripts/check-site.py
      - name: Validate Sambal Tina dictionary
        run: python3 scripts/check-dictionary.py
      - name: Validate Sambal Tina living usage
        run: python3 scripts/check-living-sambal.py
      - name: Validate the backend contract the pages depend on
        run: python3 scripts/check-backend-contract.py
      - name: Rebuild the Bulletin and verify its evidence trail
        run: python3 scripts/build-bulletin.py
      - name: Verify the MABAYANI creator stays unnamed until the closing story
        run: python3 scripts/check-mabayani-anonymity.py
      - name: Verify every municipal leader is presented identically
        run: python3 scripts/check-leadership.py
      - name: Validate search and crawler visibility
        run: python3 scripts/check-seo.py
      - name: Validate design consistency
        run: python3 scripts/check-design-consistency.py
      - name: Verify every page's markup and its stylesheets agree
        run: python3 scripts/check-stylesheets.py
      - name: Validate JavaScript syntax
        run: |
          node --check site.js
          node --check homepage.js
          node --check contact.js
          node --check bulletin.js
          node --check security.js
          node --check connect-shell.js
          node --check app-base.js
          node --check app.js
          node --check admin.js
          node --check sambal-tina.js
          node --check destinations.js
          node --check scripts/browser-qa.mjs
          node --check scripts/connect-qa.mjs
          node --check scripts/dictionary-qa.mjs
          node --check scripts/destinations-qa.mjs
          node --check scripts/responsive-qa.mjs
          node --check scripts/homepage-qa.mjs
          node --check scripts/dictionary-entries-qa.mjs
          node --check sambal-tina-living.js
          node --check sambal-tina-community.js
          node --check scripts/living-sambal-qa.mjs
          node --check scripts/sambal-community-qa-v2.mjs
          node --check bulletin.js
          node --check scripts/mabayani-qa.mjs
          node --check leadership.js
          node --check scripts/leadership-qa.mjs
          node --check scripts/contrast-qa.mjs
          node --check scripts/layout-contracts.mjs
      - name: Validate locations mapping and photography
        run: python3 scripts/check-locations.py
      - name: Audit every photograph on the site
        run: python3 scripts/check-photography.py
