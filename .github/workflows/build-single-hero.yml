name: Build single Masinloc hero image

on:
  push:
    branches:
      - main
      - agent/fix-exact-hero-file
    paths:
      - .github/workflows/build-single-hero.yml

permissions:
  contents: write

jobs:
  build-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct approved hero as one static file
        shell: bash
        run: |
          set -euo pipefail
          cat assets/stage1/hero-b64-01.txt \
              assets/stage1/hero-b64-02.txt \
              assets/stage1/hero-b64-03.txt \
              assets/stage1/hero-b64-04.txt \
              assets/stage1/hero-b64-05.txt \
              assets/stage1/hero-b64-06.txt \
              assets/stage1/hero-b64-07.txt \
            | tr -d '\r\n' \
            | base64 --decode \
            > assets/stage1/masinloc-hero.avif
          test -s assets/stage1/masinloc-hero.avif
          file assets/stage1/masinloc-hero.avif

      - name: Commit the static image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stage1/masinloc-hero.avif
          if git diff --cached --quiet; then
            echo "Hero image already up to date."
            exit 0
          fi
          git commit -m "Build single static Masinloc hero image"
          git push origin "HEAD:${GITHUB_REF_NAME}"