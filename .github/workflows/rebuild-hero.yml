name: Rebuild Masinloc hero asset

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rebuild-hero.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild complete hero image
        shell: bash
        run: |
          set -euo pipefail
          cat assets/stage1/hero-b64-01.txt \
              assets/stage1/hero-b64-02.txt \
              assets/stage1/hero-b64-03.txt \
              assets/stage1/hero-b64-04.txt \
              assets/stage1/hero-b64-05.txt \
              assets/stage1/hero-b64-06.txt \
              assets/stage1/hero-b64-07.txt \
            | tr -d '\r\n' \
            | base64 --decode \
            > assets/stage1/masinloc-hero.avif
          bytes=$(wc -c < assets/stage1/masinloc-hero.avif)
          echo "hero bytes: $bytes"
          test "$bytes" -gt 50000
          file assets/stage1/masinloc-hero.avif
      - name: Commit corrected hero image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stage1/masinloc-hero.avif
          if git diff --cached --quiet; then
            echo "Hero asset already correct."
            exit 0
          fi
          git commit -m "Rebuild complete Masinloc hero image"
          git push origin HEAD:main
