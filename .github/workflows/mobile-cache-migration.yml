name: Mobile stylesheet cache migration

on:
  push:
    branches:
      - codex/homepage-redesign-v2
    paths:
      - '.github/workflows/mobile-cache-migration.yml'
      - '**/*.html'
      - '**/*.py'
      - '**/*.js'
      - '**/*.md'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/homepage-redesign-v2
      - name: Replace stale shared stylesheet stamp
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          old_prefix = 'site-stability.css?v=20260825-'
          new_prefix = 'site-stability.css?v=20260901-'
          changed = []
          for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0'):
              if not raw:
                  continue
              path = Path(raw.decode())
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace(old_prefix + '1', new_prefix + '1').replace(old_prefix + '2', new_prefix + '1')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print(f'Updated {len(changed)} tracked files')
          for path in changed:
              print(path)
          PY
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No stale references remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Bump shared mobile stylesheet cache stamp'
          git push origin HEAD:codex/homepage-redesign-v2
