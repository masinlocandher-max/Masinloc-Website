name: Sync real POS app

on:
  push:
    branches: [launch/pos-real-app]
    paths:
      - '.github/workflows/sync-pos-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-real-pos-app
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Masinloc website
        uses: actions/checkout@v4
        with:
          ref: launch/pos-real-app
          fetch-depth: 0

      - name: Check out verified POS source
        uses: actions/checkout@v4
        with:
          repository: masinlocandher-max/POS-Masinloc
          ref: d4a70b93b8c2b11fae60223c0f6a40b7aae4e606
          path: .pos-source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .pos-source/package-lock.json

      - name: Build real POS for nested route
        working-directory: .pos-source
        env:
          VITE_BASE_PATH: /posmasinloqueno/
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          grep -q '/posmasinloqueno/assets/' dist/index.html

      - name: Replace static demo with real POS bundle
        run: |
          rm -rf posmasinloqueno
          mkdir -p posmasinloqueno
          cp -R .pos-source/dist/. posmasinloqueno/
          rm -rf .pos-source

      - name: Commit generated POS bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A posmasinloqueno
          if git diff --cached --quiet; then
            echo 'POS bundle already current.'
            exit 0
          fi
          git commit -m 'Replace POS preview with real connected app'
          git push origin HEAD:launch/pos-real-app
