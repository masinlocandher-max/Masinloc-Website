name: Security regression checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

jobs:
  security-regression-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run Masinloc security checks
        run: python3 scripts/check-security.py
