name: Repair Masinloc hero asset

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-hero-asset.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Reconstruct approved hero from all seven stored chunks
        shell: bash
        run: |
          set -euo pipefail
          cat \
            assets/stage1/hero-b64-01.txt \
            assets/stage1/hero-b64-02.txt \
            assets/stage1/hero-b64-03.txt \
            assets/stage1/hero-b64-04.txt \
            assets/stage1/hero-b64-05.txt \
            assets/stage1/hero-b64-06.txt \
            assets/stage1/hero-b64-07.txt \
            | tr -d '\r\n' \
            | base64 --decode \
            > assets/stage1/masinloc-hero.avif

          bytes=$(stat -c%s assets/stage1/masinloc-hero.avif)
          echo "Reconstructed hero size: ${bytes} bytes"
          test "$bytes" -gt 60000
          file assets/stage1/masinloc-hero.avif

      - name: Commit repaired binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stage1/masinloc-hero.avif
          git commit -m "Repair complete Masinloc hero image" || exit 0
          git push origin HEAD:main