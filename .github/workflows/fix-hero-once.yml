name: One-time exact hero rebuild

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/fix-hero-once.yml]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fmb-approved-stage1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild exact approved hero safely
        shell: bash
        run: |
          set -euo pipefail
          old=e684aada9cd667f0a2ed2b23bf8ea201e1fe2655
          work=/tmp/masinloc-hero
          output=assets/stage1/masinloc-hero.avif
          mkdir -p "$work"
          : > "$output"

          # The historical files are separately padded base64 segments.
          # They must be decoded one segment at a time, then concatenated as binary.
          # Decoding all seven as one base64 stream stops at intermediate '=' padding
          # and is the reason the previous hero was truncated.
          for i in 01 02 03 04 05 06 07; do
            git show "${old}:assets/stage1/hero-b64-${i}.txt" > "$work/${i}.b64"
            case "$i" in
              02|05|07) cat ".repair/hero-tail-${i}.txt" >> "$work/${i}.b64" ;;
            esac
            tr -d '\r\n' < "$work/${i}.b64" | base64 --decode >> "$output"
          done

          bytes=$(stat -c%s "$output")
          echo "rebuilt hero bytes: $bytes"
          test "$bytes" -eq 76913
          echo 'e7cc6d5057009c0967c770af2db0c1a5e6f72e794def8ea203079ec00abf22a5  assets/stage1/masinloc-hero.avif' | sha256sum -c -
          python3 scripts/check-site.py

      - name: Commit verified hero to repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stage1/masinloc-hero.avif
          if git diff --cached --quiet; then
            echo "Verified hero already present."
            exit 0
          fi
          git commit -m "Install verified exact Masinloc hero asset"
          git push origin HEAD:agent/fmb-approved-stage1
