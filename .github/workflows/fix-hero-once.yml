name: One-time exact hero rebuild

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.head_ref == 'agent/final-stage1-update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild and verify exact approved hero
        shell: bash
        run: |
          set -euo pipefail
          old=e684aada9cd667f0a2ed2b23bf8ea201e1fe2655
          work=/tmp/masinloc-hero
          mkdir -p "$work"

          for i in 01 03 04 06; do
            git show "${old}:assets/stage1/hero-b64-${i}.txt" > "$work/${i}.b64"
          done

          cat "$work/01.b64" \
              .repair/exact-prefix-02.txt .repair/hero-tail-02.txt \
              "$work/03.b64" \
              "$work/04.b64" \
              .repair/exact-prefix-05.txt .repair/hero-tail-05.txt \
              "$work/06.b64" \
              .repair/exact-prefix-07.txt .repair/hero-tail-07.txt \
            | tr -d '\r\n\t ' > "$work/all.b64"

          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          encoded = Path('/tmp/masinloc-hero/all.b64').read_text()
          if len(encoded) != 102552:
              raise SystemExit(f'Unexpected exact source length: {len(encoded)}')
          data = base64.b64decode(encoded, validate=True)
          target_hash = 'e7cc6d5057009c0967c770af2db0c1a5e6f72e794def8ea203079ec00abf22a5'
          digest = hashlib.sha256(data).hexdigest()
          if len(data) != 76913:
              raise SystemExit(f'Unexpected recovered size: {len(data)} bytes')
          if digest != target_hash:
              raise SystemExit(f'Exact-photo hash mismatch: {digest}')

          Path('assets/stage1/masinloc-hero.avif').write_bytes(data)
          print(f'exact approved hero recovered: {len(data)} bytes sha256={digest}')
          PY

          python3 scripts/check-site.py

      - name: Commit verified hero to repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stage1/masinloc-hero.avif
          if git diff --cached --quiet; then
            echo "Verified hero already present."
            exit 0
          fi
          git commit -m "Install verified exact Masinloc hero asset"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
