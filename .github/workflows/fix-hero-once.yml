name: One-time exact hero rebuild

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/fix-hero-once.yml]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fmb-approved-stage1
          fetch-depth: 0
      - name: Measure historical chunks before reconstruction
        shell: bash
        run: |
          set -euo pipefail
          old=e684aada9cd667f0a2ed2b23bf8ea201e1fe2655
          mkdir -p /tmp/masinloc-hero
          for i in 01 02 03 04 05 06 07; do
            git show "${old}:assets/stage1/hero-b64-${i}.txt" > "/tmp/masinloc-hero/${i}.b64"
            raw=$(wc -c < "/tmp/masinloc-hero/${i}.b64")
            clean=$(tr -d '\r\n' < "/tmp/masinloc-hero/${i}.b64" | wc -c)
            bad=$(tr -d '\r\nA-Za-z0-9+/=' < "/tmp/masinloc-hero/${i}.b64" | wc -c)
            pads=$(tr -cd '=' < "/tmp/masinloc-hero/${i}.b64" | wc -c)
            echo "chunk ${i}: raw=${raw} clean=${clean} invalid=${bad} padding=${pads}"
          done
          for i in 02 05 07; do
            raw=$(wc -c < ".repair/hero-tail-${i}.txt")
            clean=$(tr -d '\r\n' < ".repair/hero-tail-${i}.txt" | wc -c)
            bad=$(tr -d '\r\nA-Za-z0-9+/=' < ".repair/hero-tail-${i}.txt" | wc -c)
            pads=$(tr -cd '=' < ".repair/hero-tail-${i}.txt" | wc -c)
            echo "tail ${i}: raw=${raw} clean=${clean} invalid=${bad} padding=${pads}"
          done
          cat /tmp/masinloc-hero/01.b64 /tmp/masinloc-hero/02.b64 .repair/hero-tail-02.txt /tmp/masinloc-hero/03.b64 /tmp/masinloc-hero/04.b64 /tmp/masinloc-hero/05.b64 .repair/hero-tail-05.txt /tmp/masinloc-hero/06.b64 /tmp/masinloc-hero/07.b64 .repair/hero-tail-07.txt | tr -d '\r\n' > /tmp/masinloc-hero/all.b64
          echo "combined clean length: $(wc -c < /tmp/masinloc-hero/all.b64)"
          echo "combined padding count: $(tr -cd '=' < /tmp/masinloc-hero/all.b64 | wc -c)"
          echo "combined invalid count: $(tr -d 'A-Za-z0-9+/=' < /tmp/masinloc-hero/all.b64 | wc -c)"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/masinloc-hero/all.b64').read_text()
          print('first padding index:', s.find('='), 'length:', len(s), 'tail:', repr(s[-12:]))
          PY
          exit 1
