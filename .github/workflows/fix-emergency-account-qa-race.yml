name: Fix emergency account QA race

on:
  push:
    branches:
      - fix/emergency-account-qa-race
    paths:
      - '.github/workflows/fix-emergency-account-qa-race.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/emergency-account-qa-race
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Synchronize account assertions with delivered UI state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/emergency-browser-qa.mjs')
          text = path.read_text()

          old_anon = "  const anonAccess=(await page.locator('#accessValue').innerText().catch(()=>'')) .trim();"
          old_anon = "  const anonAccess=(await page.locator('#accessValue').innerText().catch(()=>''))" + ".trim();"
          new_anon = "  await page.waitForFunction(()=>/this device only/i.test(document.querySelector('#accessValue')?.textContent||''),null,{timeout:8000}).catch(()=>{});\n" + old_anon

          old_signed = "  const access=(await page.locator('#accessValue').innerText().catch(()=>''))" + ".trim();"
          new_signed = "  await page.waitForFunction(()=>/this device only/i.test(document.querySelector('#accessValue')?.textContent||''),null,{timeout:8000}).catch(()=>{});\n" + old_signed

          if text.count(old_anon) != 1:
              raise SystemExit(f'Expected one anonymous access assertion, found {text.count(old_anon)}')
          if text.count(old_signed) != 1:
              raise SystemExit(f'Expected one signed-in access assertion, found {text.count(old_signed)}')

          text = text.replace(old_anon, new_anon, 1)
          text = text.replace(old_signed, new_signed, 1)
          path.write_text(text)
          PY

      - name: Syntax check
        run: node --check scripts/emergency-browser-qa.mjs

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/masinloc-server.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/masinloc-server.log
          exit 1

      - name: Run emergency browser QA
        run: node scripts/emergency-browser-qa.mjs

      - name: Commit verified fix and remove this one-shot workflow
        run: |
          git rm .github/workflows/fix-emergency-account-qa-race.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/emergency-browser-qa.mjs
          git commit -m 'Fix emergency account browser QA race'
          git push origin HEAD:fix/emergency-account-qa-race
