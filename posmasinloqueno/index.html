<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0D3B9E">
  <title>Masinloc POS</title>
  <meta name="description" content="Masinloc POS merchant console: orders, kitchen, catalog, inventory and reports.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tokens.css?v=20260823-1">
  <link rel="stylesheet" href="pos.css?v=20260902-1">
</head>
<body>

<!-- Sign in ------------------------------------------------------------- -->
<div class="gate" id="gate">
  <div class="gate-card">
    <img class="gate-logo" src="/assets/masinloc-logo.webp" alt="Masinloc Zambales" width="140" height="32">
    <h1>Masinloc POS</h1>
    <p>Sign in to your store. Accounts are created by Masinloc Connect; there is no public sign-up.</p>

    <form id="signInForm" novalidate>
      <label class="field">
        <span>Email</span>
        <input class="input" type="email" id="email" name="email" autocomplete="username"
               inputmode="email" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input class="input" type="password" id="password" name="password"
               autocomplete="current-password">
      </label>
      <button class="btn btn-primary btn-block" type="submit" id="signInBtn">Sign in</button>
    </form>

    <div class="gate-alt">
      <button class="linkish" type="button" id="magicBtn">Email me a sign-in link instead</button>
    </div>

    <p class="note" id="gateNote" role="status" aria-live="polite"></p>
  </div>
</div>

<!-- Store picker -------------------------------------------------------- -->
<div class="gate" id="picker" hidden>
  <div class="gate-card">
    <h1>Choose a store</h1>
    <p>Your account has access to more than one store.</p>
    <div class="picker" id="pickerList"></div>
    <div class="gate-alt">
      <button class="linkish" type="button" id="pickerSignOut">Sign out</button>
    </div>
  </div>
</div>

<!-- Console ------------------------------------------------------------- -->
<div class="app" id="app" hidden>
  <header class="bar">
    <div class="bar-store">
      <b id="storeName">&nbsp;</b>
      <span id="storeMeta">&nbsp;</span>
    </div>
    <div class="bar-actions">
      <button class="btn btn-quiet btn-sm" type="button" id="refreshBtn">Refresh</button>
      <button class="btn btn-quiet btn-sm" type="button" id="signOutBtn">Sign out</button>
    </div>
  </header>

  <nav class="tabs" aria-label="Sections">
    <button class="tab" type="button" data-route="dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 8h6V4h-6z"/></svg>
      Today
    </button>
    <button class="tab" type="button" data-route="orders">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12l1 18H5zM9 8h6"/></svg>
      Orders<span class="tab-count" id="ordersCount" hidden></span>
    </button>
    <button class="tab" type="button" data-route="kitchen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h14M6 10v9h12v-9M9 10V5a3 3 0 0 1 6 0v5"/></svg>
      Kitchen<span class="tab-count" id="kitchenCount" hidden></span>
    </button>
    <button class="tab" type="button" data-route="catalog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Menu
    </button>
    <button class="tab" type="button" data-route="store">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16l-1.2 11H5.2zM4 9l1.5-5h13L20 9M9 13v3m6-3v3"/></svg>
      Store
    </button>
  </nav>

  <main class="screen" id="screen" tabindex="-1"></main>
</div>

<dialog class="sheet" id="sheet">
  <form class="sheet-body" id="sheetForm" method="dialog"></form>
</dialog>

<script type="module" src="pos.js?v=20260902-1"></script>
</body>
</html>
